# ============================================
# Mosquitto Configuration - Level 2
# Edwin's FYP Panel Monitoring System
# ============================================

# --- Network ---
listener 1883
# No IP specified = listen on ALL interfaces
# Allows ESP32 to connect from network

# --- Authentication ---
allow_anonymous false
password_file C:\Program Files\mosquitto\passwd

# --- Logging ---
log_dest stdout
log_dest file C:\Program Files\mosquitto\mosquitto.log
log_type all
connection_messages true
log_timestamp true

# --- Persistence ---
persistence true
persistence_location C:\Program Files\mosquitto\
persistence_file mosquitto.db
autosave_interval 300

# --- Connection Limits ---
max_connections 50